services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: career_watch
      POSTGRES_PASSWORD: password
      POSTGRES_DB: career_watch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career_watch -d career_watch"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Local SMTP server with a web UI at http://localhost:8025
  # Catches all outbound email — nothing is actually delivered.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

  # ── Application services (optional — use profile "app") ────────────────────
  # Run with: docker compose --profile app up
  # Or run the binaries natively with: make run-api / make run-worker

  api:
    build:
      context: .
      target: api
    profiles: ["app"]
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      target: worker
    profiles: ["app"]
    restart: "no"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  discovery:
    build:
      context: .
      target: discovery
    profiles: ["app"]
    restart: "no"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
