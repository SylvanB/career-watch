[package]
name = "career-watch"
version = "0.1.0"
edition = "2021"
description = "A job-change monitoring SaaS with notifications, analytics, and automatic career-page discovery"
license = "MIT"
repository = "https://github.com/SylvanB/career-watch"
keywords = ["job-search", "web-scraping", "saas", "axum"]
categories = ["web-programming::http-server"]

[[bin]]
name = "career-watch-api"
path = "src/main.rs"

[[bin]]
name = "career-watch-worker"
path = "src/bin/worker.rs"

[[bin]]
name = "career-watch-discovery"
path = "src/bin/discovery_worker.rs"

[[bin]]
name = "career-watch-test-server"
path = "src/bin/test_server.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1.41", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "macros", "uuid", "chrono", "migrate"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "1.0"
anyhow = "1.0"
dotenvy = "0.15"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "tokio1", "tokio1-rustls-tls", "smtp-transport"] }
sha2 = "0.10"
url = "2.5"
tower-http = { version = "0.5", features = ["trace"] }
home = "=0.5.9"
scraper = "0.19"
async-trait = "0.1"
futures = "0.3"
dashmap = "5"
argon2 = "0.5"
rand = "0.8"
axum-extra = { version = "0.9", features = ["cookie"] }
hmac = "0.12"
time = { version = "0.3", features = ["std"] }

[dev-dependencies]
tokio = { version = "1.41", features = ["full"] }
